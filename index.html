<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ep7studio | Portafolio de Arte</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    header {
      margin-bottom: 30px;
      text-align: center;
    }

    header h1 {
      font-size: 2.8rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    header p {
      color: #8892b0;
      margin-top: 5px;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    /* Contenedor principal */
    .gallery-container {
      display: flex;
      width: 100%;
      max-width: 1250px;
      height: 580px;
      gap: 12px;
    }

    /* Tarjeta individual con estilo de corte diagonal (clip-path) */
    .card {
      position: relative;
      flex: 1;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      background-size: cover;
      background-position: center;
      /* ESTO GENERA LA FORMA INCLINADA ESTILO DUET NIGHT ABYSS */
      clip-path: polygon(12% 0%, 100% 0%, 88% 100%, 0% 100%);
      filter: grayscale(30%) brightness(0.8);
    }

    /* Al pasar el cursor, se expande y se inclina menos para mostrar bien la ilustración */
    .card:hover {
      flex: 5;
      filter: grayscale(0%) brightness(1.05);
      clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%);
    }

    /* Degradado oscuro inferior */
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 10, 15, 0.95) 0%, rgba(0, 0, 0, 0.2) 50%, rgba(0, 0, 0, 0) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px 40px;
      opacity: 0.7;
      transition: opacity 0.4s ease;
    }

    .card:hover .card-overlay {
      opacity: 1;
    }

    .card-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #00f0ff;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    .card-info {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.4s ease;
      color: #ccd6f6;
      font-size: 1rem;
    }

    .card:hover .card-info {
      max-height: 100px;
      opacity: 1;
      margin-top: 8px;
    }

    /* Adaptación para dispositivos móviles */
    @media (max-width: 768px) {
      .gallery-container {
        flex-direction: column;
        height: auto;
      }
      .card {
        height: 200px;
        clip-path: polygon(0 0, 100% 0, 100% 88%, 0 100%);
      }
      .card:hover {
        height: 380px;
        clip-path: polygon(0 0, 100% 0, 100% 95%, 0 100%);
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>ep7studio</h1>
    <p>Portafolio Digital & Galería de Arte</p>
  </header>

  <div class="gallery-container">
    
    <div class="card" style="background-image: url('brujita.png');">
      <div class="card-overlay">
        <div class="card-title">Brujita</div>
        <div class="card-info">Ilustración / Concept Art</div>
      </div>
    </div>

    <div class="card" style="background-image: url('espada.png');">
      <div class="card-overlay">
        <div class="card-title">Espada</div>
        <div class="card-info">Diseño de arma / Prop</div>
      </div>
    </div>

    <div class="card" style="background-image: url('luna.png');">
      <div class="card-overlay">
        <div class="card-title">Luna</div>
        <div class="card-info">Arte conceptual</div>
      </div>
    </div>

    <div class="card" style="background-image: url('blanca.png');">
      <div class="card-overlay">
        <div class="card-title">Blanca</div>
        <div class="card-info">Diseño de personaje</div>
      </div>
    </div>

    <div class="card" style="background-image: url('rosada.png');">
      <div class="card-overlay">
        <div class="card-title">Rosada</div>
        <div class="card-info">Ilustración digital</div>
      </div>
    </div>

  </div>

</body>
</html>
