<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ep7studio | Portafolio de Arte</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f5f8;
      color: #1a1a1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    header {
      margin-bottom: 50px;
      text-align: center;
    }

    header h1 {
      font-size: 2.8rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #111;
      font-weight: 900;
    }

    header p {
      color: #666;
      margin-top: 5px;
      font-size: 1.1rem;
      letter-spacing: 2px;
    }

    /* Contenedor principal */
    .gallery-container {
      display: flex;
      width: 100%;
      max-width: 1100px;
      height: 600px;
      gap: 15px;
      align-items: center;
      justify-content: center;
    }

    /* Tarjeta individual */
    .card {
      position: relative;
      flex: 1;
      height: 480px;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      transform: skewX(-22deg);
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    /* Imagen de fondo base */
    .card-bg {
      position: absolute;
      top: 0;
      left: -40%;
      width: 180%;
      height: 100%;
      background-size: cover;
      transform: skewX(22deg);
      transition: filter 0.5s ease, background-position 0.5s ease;
      filter: brightness(0.85);
    }

    /* ENCUADRES ESPECÍFICOS PARA CADA PERSONAJE */
    /* 1. Brujita */
    .card:nth-child(1) .card-bg { background-position: 70% top; }
    .card:nth-child(1):hover .card-bg { background-position: 65% 20%; }

    /* 2. Espada */
    .card:nth-child(2) .card-bg { background-position: 70% top; }
    .card:nth-child(2):hover .card-bg { background-position: 60% 20%; }

    /* 3. Luna */
    .card:nth-child(3) .card-bg { background-position: center top; }
    .card:nth-child(3):hover .card-bg { background-position: center 15%; }

    /* 4. Blanca (Corrige el error del caballo enfocando la cara de la chica) */
    .card:nth-child(4) .card-bg { background-position: 85% top; }
    .card:nth-child(4):hover .card-bg { background-position: 80% 10%; }

    /* 5. Rosada */
    .card:nth-child(5) .card-bg { background-position: 75% top; }
    .card:nth-child(5):hover .card-bg { background-position: 70% 15%; }

    /* ESCALONADO VERTICAL */
    .card:nth-child(1) { transform: skewX(-22deg) translateY(-40px); }
    .card:nth-child(2) { transform: skewX(-22deg) translateY(30px); }
    .card:nth-child(3) { transform: skewX(-22deg) translateY(-20px); }
    .card:nth-child(4) { transform: skewX(-22deg) translateY(50px); }
    .card:nth-child(5) { transform: skewX(-22deg) translateY(-30px); }

    /* Hover */
    .card:hover {
      flex: 3.5;
      z-index: 10;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    .card:hover .card-bg {
      filter: brightness(1.05);
    }

    /* Sombra y texto inferior */
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 60%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 25px;
      transform: skewX(22deg);
      opacity: 0.8;
      transition: opacity 0.4s ease;
    }

    .card:hover .card-overlay {
      opacity: 1;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-info {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.4s ease;
      color: #ddd;
      font-size: 0.9rem;
    }

    .card:hover .card-info {
      max-height: 80px;
      opacity: 1;
      margin-top: 5px;
    }

    /* Adaptación para móviles */
    @media (max-width: 768px) {
      .gallery-container {
        flex-direction: column;
        height: auto;
      }
      .card {
        width: 100%;
        height: 180px;
        transform: skewX(0deg) !important;
      }
      .card-bg, .card-overlay {
        transform: skewX(0deg) !important;
        width: 100%;
        left: 0;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>ep7studio</h1>
    <p>Portafolio Digital & Galería de Arte</p>
  </header>

  <div class="gallery-container">
    
    <div class="card">
      <div class="card-bg" style="background-image: url('brujita.png');"></div>
      <div class="card-overlay">
        <div class="card-title">Brujita</div>
        <div class="card-info">Ilustración / Arte conceptual</div>
      </div>
    </div>

    <div class="card">
      <div class="card-bg" style="background-image: url('espada.png');"></div>
      <div class="card-overlay">
        <div class="card-title">Espada</div>
        <div class="card-info">Diseño de arma / Prop</div>
      </div>
    </div>

    <div class="card">
      <div class="card-bg" style="background-image: url('luna.png');"></div>
      <div class="card-overlay">
        <div class="card-title">Luna</div>
        <div class="card-info">Arte conceptual</div>
      </div>
    </div>

    <div class="card">
      <div class="card-bg" style="background-image: url('blanca.png');"></div>
      <div class="card-overlay">
        <div class="card-title">Blanca</div>
        <div class="card-info">Diseño de personaje</div>
      </div>
    </div>

    <div class="card">
      <div class="card-bg" style="background-image: url('rosada.png');"></div>
      <div class="card-overlay">
        <div class="card-title">Rosada</div>
        <div class="card-info">Ilustración digital</div>
      </div>
    </div>

  </div>

</body>
</html>
